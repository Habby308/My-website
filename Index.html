<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HABBY | Official Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    .hero {
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      background: linear-gradient(180deg, #151515, #080808);
    }

    .hero h1 {
      font-size: 70px;
      margin: 0;
      letter-spacing: 5px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
      margin: 15px 0 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 30px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }

    .music {
      padding: 60px 20px;
      text-align: center;
    }

    .music h2 {
      font-size: 35px;
    }

    .song {
      max-width: 500px;
      margin: 25px auto;
      padding: 25px;
      background: #151515;
      border-radius: 18px;
    }

    .song h3 {
      font-size: 23px;
      margin-bottom: 10px;
    }

    .song p {
      color: #999;
    }

    .socials {
      text-align: center;
      padding: 40px 20px;
      background: #111;
    }

    .socials a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>HABBY</h1>

    <p>Artist • Singer • Songwriter</p>

    <a href="#music" class="button">LISTEN NOW</a>
  </section>


  <section class="music" id="music">

    <h2>My Music 🎵</h2>

    <div class="song">
      <h3>In The Room</h3>
      <p>HABBY</p>
      <a href="#" class="button">PLAY</a>
    </div>

    <div class="song">
      <h3>Call Me When You Need It</h3>
      <p>HABBY</p>
      <a href="#" class="button">PLAY</a>
    </div>

  </section>


  <section class="socials">

    <h2>Follow HABBY</h2>

    <br>

    <a href="#">Instagram</a>
    <a href="#">TikTok</a>
    <a href="#">YouTube</a>
    <a href="#">Audiomack</a>

  </section>


  <footer>
    © 2026 HABBY. All rights reserved.
  </footer>

</body>
</html>
